[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-contrib"
version = "0.2.0"
description = "Read-only GitHub agent contribution protocol experiment"
requires-python = ">=3.10"
dependencies = []
license = {text = "MIT OR Apache-2.0"}

[project.scripts]
agent-contrib = "agent_contribute.cli:main"

[tool.setuptools.packages.find]
include = ["agent_contribute*"]

[tool.setuptools.package-data]
agent_contribute = ["*.schema.json", "instructions.md", "adapters/agent-contribute/SKILL.md"]
